# S6: the Lensa pod and its Service. ${IMAGE} is the ghcr digest reference given to render.sh. The ConfigMap lensa-env is generated by render.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lensa
  namespace: rd-lensa
  labels: {part-of: rd-lensa, app: lensa}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: lensa}
  template:
    metadata:
      # role=server is what Service lensa selects: a Job pod that carries app=lensa (the egress-probe, to fall under the real egress policy) is never a Service endpoint
      labels: {part-of: rd-lensa, app: lensa, role: server}
    spec:
      serviceAccountName: lensa
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # cluster-1 nodes member-16033 (97% CPU requests) and member-16034 take no new pods (README, limits)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [member-16033-node, member-16034-node]}
      containers:
        - name: lensa
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8790, protocol: TCP}
          envFrom:
            - configMapRef: {name: lensa-env}
          env:
            - {name: HOME, value: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # The startup probe protects a slow start, so it uses the liveness route: with an unseeded state no model loads and /api/readyz answers
          # 503 by design, which must not get the pod killed. Readiness (below) keeps the Service without an endpoint until a model loaded.
          startupProbe:
            httpGet: {path: /api/livez, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/readyz, port: http}
            periodSeconds: 10
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /api/livez, port: http}
            periodSeconds: 30
            failureThreshold: 3
          # starting values: measured during the S6 shadow, then fixed here
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /app/frontend/server/state}
            - {name: certs, mountPath: /certs, readOnly: true}
            - {name: certs-iroha, mountPath: /certs-iroha, readOnly: true}
            - {name: iroha3-state, mountPath: /iroha3-state, readOnly: true}
            # file over the PVC state dir: the pod seed never holds iroha3.json (render.sh seed refuses it), and adapters/iroha3.ts reads <state dir>/iroha3.json
            - {name: iroha3-state, mountPath: /app/frontend/server/state/iroha3.json, subPath: iroha3.json, readOnly: true}
            - {name: sink-tokens, mountPath: /sink-tokens, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          persistentVolumeClaim: {claimName: lensa-state}
        # one client certificate set per party: LENSA_GW_MTLS_DIR/<BI|A|B|C>/{ca.crt,lensa.crt,lensa.key} (server/src/gateway.ts). Not optional:
        # a missing party Secret stops the pod instead of starting it with a half-empty cert directory.
        - name: certs
          projected:
            sources:
              - secret:
                  name: lensa-gw-mtls-bi
                  items: [{key: ca.crt, path: BI/ca.crt}, {key: lensa.crt, path: BI/lensa.crt}, {key: lensa.key, path: BI/lensa.key}]
              - secret:
                  name: lensa-gw-mtls-a
                  items: [{key: ca.crt, path: A/ca.crt}, {key: lensa.crt, path: A/lensa.crt}, {key: lensa.key, path: A/lensa.key}]
              - secret:
                  name: lensa-gw-mtls-b
                  items: [{key: ca.crt, path: B/ca.crt}, {key: lensa.crt, path: B/lensa.crt}, {key: lensa.key, path: B/lensa.key}]
              - secret:
                  name: lensa-gw-mtls-c
                  items: [{key: ca.crt, path: C/ca.crt}, {key: lensa.crt, path: C/lensa.crt}, {key: lensa.key, path: C/lensa.key}]
        # Iroha 3 (keyless, driverAps): LENSA_GW_MTLS_DIR_IROHA/<BI|A|B|C>/{server-ca.pem,lensa.crt,lensa.key} (server/src/gateway.ts), independent of /certs. Not optional.
        - name: certs-iroha
          projected:
            sources:
              - secret:
                  name: lensa-gw-mtls-iroha-bi
                  items: [{key: server-ca.pem, path: BI/server-ca.pem}, {key: lensa.crt, path: BI/lensa.crt}, {key: lensa.key, path: BI/lensa.key}]
              - secret:
                  name: lensa-gw-mtls-iroha-a
                  items: [{key: server-ca.pem, path: A/server-ca.pem}, {key: lensa.crt, path: A/lensa.crt}, {key: lensa.key, path: A/lensa.key}]
              - secret:
                  name: lensa-gw-mtls-iroha-b
                  items: [{key: server-ca.pem, path: B/server-ca.pem}, {key: lensa.crt, path: B/lensa.crt}, {key: lensa.key, path: B/lensa.key}]
              - secret:
                  name: lensa-gw-mtls-iroha-c
                  items: [{key: server-ca.pem, path: C/server-ca.pem}, {key: lensa.crt, path: C/lensa.crt}, {key: lensa.key, path: C/lensa.key}]
        # public Iroha 3 state: iroha3.json (state.dir /iroha3-state, driverAps, public keys, driver URLs) and genesis.expected_hash. Created by the operator, never rendered.
        - name: iroha3-state
          configMap: {name: lensa-iroha3-state}
        # LENSA_SINK_TOKENS_DIR: one bearer token per party, file <BI|A|B|C>, from Secret lensa-sink-token-<bi|a|b|c> (key `token`, 64 hex, no newline). Each party
        # creates only its own Secret; they are never rendered here. Mode 0440 so the pod group (fsGroup 10001) reads it: server/src/policy/sink.ts pod mode
        # (LENSA_IN_CLUSTER=1 and this read-only mount) accepts exactly that. Not optional: a half-configured pod must not start.
        - name: sink-tokens
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: lensa-sink-token-bi
                  items: [{key: token, path: BI}]
              - secret:
                  name: lensa-sink-token-a
                  items: [{key: token, path: A}]
              - secret:
                  name: lensa-sink-token-b
                  items: [{key: token, path: B}]
              - secret:
                  name: lensa-sink-token-c
                  items: [{key: token, path: C}]
---
apiVersion: v1
kind: Service
metadata:
  name: lensa
  namespace: rd-lensa
  labels: {part-of: rd-lensa}
spec:
  type: ClusterIP
  selector: {app: lensa, role: server}
  ports:
    - {name: http, port: 8790, targetPort: http, protocol: TCP}
