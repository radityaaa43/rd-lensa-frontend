# Lensa in-cluster, cluster 1 (final-design/lensa/PLAN.md S4a). Rendered by ../render.sh: namespace, default-deny, DNS, party-operator RBAC.
apiVersion: v1
kind: Namespace
metadata:
  name: rd-lensa
  labels:
    part-of: rd-lensa
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rd-lensa
  labels: {part-of: rd-lensa}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS only: the cluster resolver in kube-system (label k8s-app=kube-dns is the CoreDNS default [unverified on this cluster: read it before the apply]).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: rd-lensa
  labels: {part-of: rd-lensa}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lensa
  namespace: rd-lensa
  labels: {part-of: rd-lensa}
automountServiceAccountToken: false
---
# Operator side (README decision 25): the Lensa operator creates the Secrets and runs the workloads here; secrets are create/update/patch only,
# never get/list/watch. No pods/exec, no pods/portforward, nothing cluster-scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lensa-admin
  namespace: rd-lensa
  labels: {part-of: rd-lensa}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lensa-admin
  namespace: rd-lensa
  labels: {part-of: rd-lensa}
rules:
  - apiGroups: [""]
    resources: [services, configmaps, persistentvolumeclaims, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lensa-admin
  namespace: rd-lensa
  labels: {part-of: rd-lensa}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: lensa-admin}
subjects:
  - {kind: ServiceAccount, name: lensa-admin, namespace: rd-lensa}
