# Egress allow-list of Lensa (read by render.sh into NetworkPolicies egress-gateways-public and egress-gateways-flow). Empty = no gateway egress (deny).
# One line per destination, filled from each platform's gateway step before the policy is applied:
#   <namespace> <podLabelKey>=<value> <port>[,<port>...]      gateway pods of a cluster-1 party namespace rd-<zeto|stealth|iroha3|fabricx>-<bi|bank-a|bank-b>
#   ipblock <a.b.c.d/32> <port>[,<port>...] <platform>          a public gateway endpoint of bank C (cluster 2), one /32 per load balancer; platform = zeto|fabricx|iroha3|stealth (required)
#
# The rows are split by platform into two NetworkPolicies: zeto + iroha3 + stealth -> egress-gateways-public (role=server: the public pod; stealth since S17, iroha3 for the keyless driverAps model), fabricx + iroha3 + stealth -> egress-gateways-flow (role=flow: lensa-flow).
#
# zeto (besu's design for G1, pre-merge: confirm against the G1 PR): Deployment + Service bank-gw-<N> in rd-zeto-<party>, pod labels
# {app: bank-gw, node: node<N>}, envoy on 8548 (Paladin JSON-RPC door) and 8545 (Besu door).
rd-zeto-bi     app=bank-gw 8548,8545
rd-zeto-bank-a app=bank-gw 8548,8545
rd-zeto-bank-b app=bank-gw 8548,8545
#
# fabricx (fabric, confirmed by a read of the cluster): Deployment fx-gw-<N> in rd-fabricx-<party>, pod label app.kubernetes.io/name=fx-gw-<N>, port 8443.
rd-fabricx-bi     app.kubernetes.io/name=fx-gw-1 8443
rd-fabricx-bank-a app.kubernetes.io/name=fx-gw-2 8443
rd-fabricx-bank-b app.kubernetes.io/name=fx-gw-3 8443
#
# iroha3 (iroha, 2026-11-12): Service gateway (mTLS) in rd-iroha3-<party>, pod label rd-iroha3/role=gateway, port 8443. Live: bi; bank-a / bank-b when their gateways are applied. Both pod classes reach them.
rd-iroha3-bi     rd-iroha3/role=gateway 8443
rd-iroha3-bank-a rd-iroha3/role=gateway 8443
rd-iroha3-bank-b rd-iroha3/role=gateway 8443
#
# stealth (besu, from the merged render, not deployed yet): Deployment st-gw-<N> in rd-stealth-<party>, pod label app=st-gw, port 8550 (mTLS, Service st-gw-<N>).
rd-stealth-bi     app=st-gw 8550
rd-stealth-bank-a app=st-gw 8550
rd-stealth-bank-b app=st-gw 8550
# Bank C (cluster 2) is one `ipblock <LB /32> <ports> <platform>` line per gateway load balancer (zeto, fabricx 8443, iroha3 8443, stealth 8550); the addresses are NOT committed:
# the operator passes them at apply time in an extra file through LENSA_GATEWAYS (public repo, and an address can change when a Service is recreated).
