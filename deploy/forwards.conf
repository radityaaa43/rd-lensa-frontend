# One kubectl port-forward per line, run by lensa-pf@<name>.service: <name> <namespace> <service> <local>:<remote>
# Paladin JSON-RPC through each party's own gateway in its own namespace (zeto S21: one namespace per bank). Bank C (node4, cluster 2) has no
# line yet: pf.sh uses the default kubectl context, so it needs a second kubeconfig first (zeto S21 / cluster-2 capacity).
paladin-node1 rd-zeto-bi     bank-gw-1 31548:8548
paladin-node2 rd-zeto-bank-a bank-gw-2 31648:8548
paladin-node3 rd-zeto-bank-b bank-gw-3 31748:8548
# Besu: Lensa's main URL (reads, receipts, BI's txs) is BI's gateway Besu door, local 38545. 8545 is left to whoever holds it.
besu          rd-zeto-bi     bank-gw-1 38545:8545
# Besu door of each bank's own gateway (same OPA rules + mTLS): the Stealth txs a bank signs enter at its own node (LENSA_BESU_RPC_BANKS).
besu-bank-a   rd-zeto-bank-a bank-gw-2 38546:8545
besu-bank-b   rd-zeto-bank-b bank-gw-3 38547:8545
iroha-bi      iroha3  bi     38080:8080
iroha-bank-a  iroha3  bank-a 38081:8080
iroha-bank-b  iroha3  bank-b 38082:8080
iroha-bank-c  iroha3  bank-c 38083:8080
# BI auditor of the APS private DvP (iroha3 repo deploy/k8s-apps/bi-auditor.yaml): BI lens reads its decrypted records.
iroha-auditor iroha3  bi-auditor 38090:8090
