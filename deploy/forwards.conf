# One kubectl port-forward per line, run by lensa-pf@<name>.service: <name> <namespace> <service> <local>:<remote>
# Paladin JSON-RPC (the WS ports 31x49 belong to another tool and are not here).
paladin-node1 paladin bank-gw-1 31548:8548
paladin-node2 paladin bank-gw-2 31648:8548
paladin-node3 paladin bank-gw-3 31748:8548
paladin-node4 paladin bank-gw-4 31848:8548
# Besu: one URL for Lensa, so one gateway. bank-gw-1's Besu door (same rules on every gateway), local 38545. 8545 is left to whoever holds it.
besu          paladin bank-gw-1 38545:8545
iroha-bi      iroha3  bi     38080:8080
iroha-bank-a  iroha3  bank-a 38081:8080
iroha-bank-b  iroha3  bank-b 38082:8080
iroha-bank-c  iroha3  bank-c 38083:8080
# Fabric-X: each party's OPA gateway fx-gw-N (mTLS), used when LENSA_FABRICX_GW=1 (fabric-x/opa/DESIGN.md).
fabricx-gw-1  fabricx fx-gw-1 39441:8443
fabricx-gw-2  fabricx fx-gw-2 39442:8443
fabricx-gw-3  fabricx fx-gw-3 39443:8443
fabricx-gw-4  fabricx fx-gw-4 39444:8443
