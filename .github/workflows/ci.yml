name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -w web
      # The server needs no sibling checkout: the code it imports from besu, iroha3 and the Paladin SDK is in server/vendor
      # (scripts/vendor-siblings.sh, server/test/vendor-layout.test.ts), so the whole suite and tsc run here.
      - run: npm run typecheck -w server
      - run: npm test -w server
      - run: deploy/k8s/test.sh
