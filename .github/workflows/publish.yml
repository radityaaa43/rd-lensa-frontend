name: publish

# Pushes the Lensa image to ghcr.io (final-design/lensa/PLAN.md S3). Manual trigger ONLY: a push to the registry is an outward write, so it runs
# when someone starts it (`gh workflow run publish.yml --ref main`) inside an approved GO window, never on merge.
# The image is pushed under a commit tag; the manifests take the DIGEST printed in the job summary, never the tag.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/radityaaa43/rd-lensa-frontend

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # packages: write on this job only
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the base image by digest
        id: base
        run: |
          d=$(docker buildx imagetools inspect node:22-bookworm-slim --format '{{.Manifest.Digest}}')
          echo "image=node@$d" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >
          docker build --build-arg NODE_IMAGE="${{ steps.base.outputs.image }}"
          --label org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          --label org.opencontainers.image.revision="${{ github.sha }}"
          -t "$IMAGE:sha-${{ github.sha }}" .
      - name: Same checks as the image workflow (non-root, no key files, no cluster tooling, health)
        run: |
          test "$(docker image inspect "$IMAGE:sha-${{ github.sha }}" --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint sh "$IMAGE:sha-${{ github.sha }}" -c '
            bad=$(find /app -xdev \( -name "*.key" -o -name "*.pem" -o -name "*.crt" -o -name "*.toml" -o -name ".env*" -o -name "alibaba.yaml" -o -name "kubeconfig*" \) -not -path "*/node_modules/*" -not -path "*/vendor/*")
            test -z "$bad" || { echo "$bad"; exit 1; }
            test -z "$(ls -A /app/frontend/server/state)"
            for t in kubectl docker opa iroha; do command -v "$t" && exit 1; done; exit 0'
          docker run -d --name lensa "$IMAGE:sha-${{ github.sha }}"
          for i in $(seq 1 30); do
            docker exec lensa node -e "fetch('http://127.0.0.1:8790/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && exit 0
            sleep 2
          done
          docker logs lensa
          exit 1
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push and print the digest
        run: |
          docker push "$IMAGE:sha-${{ github.sha }}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${{ github.sha }}" --format '{{.Manifest.Digest}}')
          echo "digest $IMAGE@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
