name: image

# Builds the Lensa image and checks it. Nothing is pushed: the push to ghcr.io and the digest hand-off to the manifests
# are added by a later PR, after the registry GO (final-design/lensa/PLAN.md S3).
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - server/**
      - web/**
      - deploy/ci/**
      - .github/workflows/image.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the base image by digest
        id: base
        run: |
          d=$(docker buildx imagetools inspect node:22-bookworm-slim --format '{{.Manifest.Digest}}')
          echo "image=node@$d" >> "$GITHUB_OUTPUT"
          echo "base image node@$d" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: docker build --build-arg NODE_IMAGE="${{ steps.base.outputs.image }}" -t rd-lensa:ci .
      - name: Image checks (non-root, no key names, state dir empty, no cluster tools, PEM content scan, /api/health)
        run: deploy/ci/image-checks.sh rd-lensa:ci
